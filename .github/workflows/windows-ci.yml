name: Windows CI (x86)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CLCL and installer (Release x86)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Check fork identity isolation
        shell: powershell
        run: .\\scripts\\verify-isolation.ps1

      - name: Build application, settings and installer
        shell: powershell
        run: |
          & .\Installer\build.ps1 -Configuration Release -Platform x86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify expected outputs
        shell: powershell
        run: |
          $files = @('Release/CLCLNext.exe', 'Release/CLCLNextSet.exe')
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing build output: $file" }
          }
          $installers = @(Get-ChildItem 'Installer/out/clcl-next-*-setup.exe' -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) { throw 'Missing installer output in Installer/out' }

      - name: Upload unsigned CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clcl-next-ci-windows-x86-unsigned
          path: |
            Release/CLCLNext.exe
            Release/CLCLNextSet.exe
            Installer/out/clcl-next-*-setup.exe
            LICENSE
            readme_en.txt
          if-no-files-found: error
          retention-days: 14
